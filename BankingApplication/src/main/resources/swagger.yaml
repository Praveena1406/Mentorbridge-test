openapi: 3.0.0
info:
  title: Bank Management System
  version: 1.0.0
  description: Banking System
paths:
  /account:
    post:
      tags:
        - Bank
      summary: Add Account holders
      operationId: addAccount

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankDto'
      responses:
        '201':
          description: New account created successfully
          content:
            application/json:
              schema:
                type: string
    get:
      tags:
        - Bank
      summary: Get all accounts
      operationId: getAllAccounts
      responses:
        '200':
          description: Get all accounts
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BankDto'

  /account/deposit/{accountnumber}:
    put:
      tags:
        - Bank
      summary: Deposit the amount
      operationId: depositAmount
      parameters:
        - in: path
          name: accountnumber
          required: true
          schema:
            type: string

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
      responses:
        '201':
          description: Deposit amount successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDto'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                type: string
  /account/withdraw/{accountnumber}:
    put:
      tags:
        - Bank
      summary: Withdraw the amount
      operationId: withdrawAmount
      parameters:
        - in: path
          name: accountnumber
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double


      responses:
        '201':
          description: Withdraw Amount successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDto'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                type: string
  /account/{id}:
    get:
      tags:
        - Bank
      summary: Get account details by id
      operationId: getAccountById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Get account by Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDto'


components:
  schemas:
    BankDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        accountNumber:
          type: string
        accountHolderName:
          type: string
        mobile:
          type: string
        accountType:
          type: string
        balance:
          type: number
          format: double
